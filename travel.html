<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的旅遊地圖</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.3/leaflet.css" />

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #cfe8f5;
        }

        .header {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            color: #333;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 12px;
            color: #777;
        }

        /* 側邊清單 */
        .places-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            width: 240px;
            max-height: calc(100vh - 20px);
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .places-panel h3 {
            margin: 0;
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            font-size: 15px;
        }

        .places-list {
            overflow-y: auto;
            padding: 6px;
        }

        .places-list details {
            margin-bottom: 6px;
            border: 1px solid #eee;
            border-radius: 6px;
            overflow: hidden;
        }

        .places-list summary {
            padding: 8px 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            background: #f5f7fa;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .places-list summary::-webkit-details-marker { display: none; }

        .places-list summary .flag { margin-right: 6px; }

        .region-item {
            padding: 7px 12px;
            font-size: 13px;
            cursor: pointer;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
        }

        .region-item:hover {
            background-color: #f0f6ff;
        }

        .region-item.active {
            background-color: #dbe9ff;
            font-weight: bold;
        }

        .region-item .count {
            color: #999;
            font-size: 11px;
        }

        .toolbar {
            position: absolute;
            bottom: 20px;
            left: 10px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        .toolbar button {
            padding: 8px 12px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            box-shadow: 0 0 6px rgba(0,0,0,0.15);
        }

        .toolbar button:hover {
            background: #f0f0f0;
        }

        /* 標記樣式 */
        .place-dot {
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        .place-dot.active-marker {
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(255, 90, 90, 0.6); }
            70%  { box-shadow: 0 0 0 12px rgba(255, 90, 90, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 90, 90, 0); }
        }

        .taiwan-star {
            font-size: 22px;
            color: #f1c40f;
            text-shadow: 0 0 3px #000, 0 0 3px #000;
        }

        .visit-popup h4 {
            margin: 0 0 6px;
            font-size: 14px;
        }

        .visit-popup ul {
            margin: 0;
            padding-left: 18px;
            font-size: 12px;
        }

        /* 飛行弧線動畫 */
        .flight-arc {
            animation: dash 1.2s linear forwards;
        }

        @keyframes dash {
            from { stroke-dashoffset: 1000; }
            to   { stroke-dashoffset: 0; }
        }

        @media (max-width: 600px) {
            .places-panel {
                width: calc(100% - 20px);
                max-height: 40vh;
                top: auto;
                bottom: 70px;
                right: 10px;
                left: 10px;
            }
            .header {
                left: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>我的旅遊地圖</h1>
        <p>點選右側清單或地圖上的地標，可放大並查看造訪日期</p>
    </div>

    <div id="map"></div>

    <div class="places-panel">
        <h3>造訪紀錄</h3>
        <div class="places-list" id="placesList"></div>
    </div>

    <div class="toolbar">
        <button id="resetBtn">重置檢視</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.3/leaflet.js"></script>

    <script>
        // ============================================================
        // 資料設定區：可以直接在這裡新增/修改國家、地區與造訪日期
        // date 格式請用 "YYYY-MM-DD"，一個地區可以有多筆造訪紀錄
        // ============================================================
        const HOME = { name: "台北", lat: 25.0330, lng: 121.5654 }; // 弧線的起點（出發地）

        const countries = [
            {
                name: "中國", flag: "🇨🇳", color: "#de2910",
                regions: [
                    { name: "上海", lat: 31.2304, lng: 121.4737, visits: ["2007-06-29"] }
                ]
            },
            {
                name: "日本", flag: "🇯🇵", color: "#bc002d",
                regions: [
                    { name: "東京", lat: 35.6762, lng: 139.6503, visits: ["2019-09-02"] },
                    { name: "北海道", lat: 43.0618, lng: 141.3545, visits: ["2020-02-13"] },
                    { name: "新潟", lat: 37.9026, lng: 139.0232, visits: ["2024-05-20"] },
                    { name: "大阪", lat: 34.6937, lng: 135.5023, visits: ["2023-11-23"] },
                    { name: "福岡", lat: 33.5904, lng: 130.4017, visits: ["2025-09-30"] }
                ]
            },
            {
                name: "香港", flag: "🇭🇰", color: "#7a1f2b",
                regions: [
                    { name: "香港", lat: 22.3193, lng: 114.1694, visits: ["2025-01-24"] }
                ]
            },
            {
                name: "澳門", flag: "🇲🇴", color: "#1aa180",
                regions: [
                    { name: "澳門", lat: 22.1987, lng: 113.5439, visits: ["2011-07-06"] }
                ]
            },
            {
                name: "泰國", flag: "🇹🇭", color: "#2d2a4a",
                regions: [
                    { name: "曼谷", lat: 13.7563, lng: 100.5018, visits: ["2025-01-24"] }
                ]
            },
            {
                name: "馬來西亞", flag: "🇲🇾", color: "#FF44AA",
                regions: [
                    { name: "馬來西亞", lat: 3.1575, lng: 101.7114, visits: ["2016-08-22"] }
                ]
            }
        ];
        // ============================================================

        // 初始化地圖，聚焦在東亞
        const map = L.map('map', {
            minZoom: 3,
            maxBounds: [[-5, 70], [60, 170]],
            maxBoundsViscosity: 0.6
        }).setView([27, 122], 5);

        // 使用 Esri 提供的免費底圖（而非直接打 OSM 志工維運的 tile server），
        // 符合 OSM Tile Usage Policy 對一般網站的使用規範
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ',
            maxZoom: 18
        }).addTo(map);

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return `${y}年${m}月${d}日`;
        }

        function makeDotIcon(color, size = 16) {
            return L.divIcon({
                className: '',
                html: `<div class="place-dot" style="width:${size}px;height:${size}px;background:${color};"></div>`,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
        }

        // 起點（台灣）標記
        const homeMarker = L.marker([HOME.lat, HOME.lng], {
            icon: L.divIcon({
                className: '',
                html: '<div class="taiwan-star">★</div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            })
        }).addTo(map).bindTooltip(HOME.name, { permanent: false });

        // 產生台灣 -> 目的地 的弧線座標點（二次貝茲曲線近似）
        function getArcLatLngs(start, end, segments = 80, curveFactor = 0.25) {
            const dx = end.lng - start.lng;
            const dy = end.lat - start.lat;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const midLat = (start.lat + end.lat) / 2;
            const midLng = (start.lng + end.lng) / 2;

            // 垂直於連線方向的偏移，讓路徑呈現弧形
            const perpLat = dx / dist;
            const perpLng = -dy / dist;
            const offset = dist * curveFactor;

            const ctrlLat = midLat + perpLat * offset;
            const ctrlLng = midLng + perpLng * offset;

            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const lat = (1 - t) * (1 - t) * start.lat + 2 * (1 - t) * t * ctrlLat + t * t * end.lat;
                const lng = (1 - t) * (1 - t) * start.lng + 2 * (1 - t) * t * ctrlLng + t * t * end.lng;
                points.push([lat, lng]);
            }
            return points;
        }

        const ARC_STYLE = { weight: 2, opacity: 0.5 };
        const ARC_ACTIVE_STYLE = { weight: 4, opacity: 0.95 };

        let activeArc = null;
        let activeMarkerEl = null;
        let activeListEl = null;

        // 清除目前選取的高亮狀態（弧線本身一律保留顯示）
        function clearActive() {
            if (activeArc) {
                activeArc.setStyle(ARC_STYLE);
                activeArc = null;
            }
            if (activeMarkerEl) {
                activeMarkerEl.classList.remove('active-marker');
                activeMarkerEl = null;
            }
            if (activeListEl) {
                activeListEl.classList.remove('active');
                activeListEl = null;
            }
        }

        // 建立台北 -> 目的地的弧線，預設就畫在地圖上
        function createArc(region) {
            const arcPoints = getArcLatLngs(HOME, region);
            return L.polyline(arcPoints, {
                color: region.color || '#e74c3c',
                dashArray: '8 6',
                className: 'flight-arc',
                ...ARC_STYLE
            }).addTo(map);
        }

        function selectRoute(region, marker, listEl) {
            clearActive();

            region.arc.setStyle(ARC_ACTIVE_STYLE);
            region.arc.bringToFront();
            activeArc = region.arc;

            const el = marker.getElement();
            const dot = el ? el.querySelector('.place-dot') : null;
            if (dot) {
                dot.classList.add('active-marker');
                activeMarkerEl = dot;
            }

            if (listEl) {
                listEl.classList.add('active');
                activeListEl = listEl;
            }

            const datesHtml = region.visits
                .slice()
                .sort()
                .map(d => `<li>${formatDate(d)}</li>`)
                .join('');

            marker.bindPopup(`
                <div class="visit-popup">
                    <h4>${region.countryName} ・ ${region.name}</h4>
                    <ul>${datesHtml}</ul>
                </div>
            `).openPopup();

            map.fitBounds(L.latLngBounds([[HOME.lat, HOME.lng], [region.lat, region.lng]]), { padding: [80, 80] });
        }

        // 建立地圖標記與右側清單
        const listContainer = document.getElementById('placesList');
        const allLatLngs = [[HOME.lat, HOME.lng]];

        countries.forEach(country => {
            const details = document.createElement('details');
            details.open = true;

            const summary = document.createElement('summary');
            summary.innerHTML = `<span><span class="flag">${country.flag}</span>${country.name}</span><span class="count">${country.regions.length}</span>`;
            details.appendChild(summary);

            country.regions.forEach(region => {
                region.countryName = country.name;
                region.color = country.color;
                allLatLngs.push([region.lat, region.lng]);
                region.arc = createArc(region);

                const marker = L.marker([region.lat, region.lng], {
                    icon: makeDotIcon(country.color)
                }).addTo(map).bindTooltip(`${country.name}・${region.name}`);

                const item = document.createElement('div');
                item.className = 'region-item';
                item.innerHTML = `<span>${region.name}</span><span class="count">${region.visits.length} 次</span>`;
                item.addEventListener('click', () => selectRoute(region, marker, item));

                marker.on('click', () => selectRoute(region, marker, item));

                details.appendChild(item);
            });

            listContainer.appendChild(details);
        });

        const overviewBounds = L.latLngBounds(allLatLngs);
        map.fitBounds(overviewBounds, { padding: [30, 30] });

        document.getElementById('resetBtn').addEventListener('click', () => {
            clearActive();
            map.closePopup();
            map.fitBounds(overviewBounds, { padding: [30, 30] });
        });
    </script>
</body>
</html>
