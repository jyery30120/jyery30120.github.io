<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台積薪水計算機</title>
<style>
:root{
  --bg:#0f1117;--surface:#1a1d2e;--surface2:#252840;--border:#333655;
  --text:#e8eaf0;--muted:#8a8eb0;--accent:#6c8fff;--accent2:#a78bfa;
  --green:#4ade80;--yellow:#facc15;--orange:#fb923c;--red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:"Segoe UI",system-ui,sans-serif;color:var(--text);min-height:100vh;}
h1{text-align:center;padding:2rem 1rem 1rem;font-size:1.8rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:1.5rem;}

/* Inputs */
.inputs-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.5rem;max-width:1200px;margin:0 auto 1.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;}
.field{display:flex;flex-direction:column;gap:.4rem;}
.field label{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.field input{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:.55rem .75rem;color:var(--text);font-size:.95rem;outline:none;transition:.2s;}
.field input:focus{border-color:var(--accent);}
.field .hint{font-size:.7rem;color:var(--muted);}
.field.check{justify-content:center;}
.check-row{display:flex;align-items:center;gap:.5rem;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:.55rem .75rem;cursor:pointer;transition:.2s;}
.check-row:hover{border-color:var(--accent);}
.check-row input{width:1.05rem;height:1.05rem;accent-color:var(--accent);cursor:pointer;flex:none;}
.check-row span{font-size:.9rem;}
.preset-row{display:flex;gap:.4rem;}
.preset-btn{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:.35rem .5rem;color:var(--muted);font-size:.85rem;font-weight:600;cursor:pointer;transition:.2s;}
.preset-btn:hover{border-color:var(--accent);color:var(--text);}
.preset-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.calc-btn{display:block;margin:0 auto 2rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;padding:.75rem 3rem;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;}
.download-btn{display:block;margin:0 auto 1.5rem;background:var(--surface2);color:var(--text);border:1.5px solid var(--border);border-radius:10px;padding:.55rem 2rem;font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s;}
.download-btn:hover{border-color:var(--accent);color:var(--accent);}
.calc-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(108,143,255,.35);}

/* Summary */
.quick-card{max-width:1300px;margin:0 auto 1rem;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent2);border-radius:12px;padding:1rem 1.25rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4rem;}
.quick-card .label{font-size:.72rem;color:var(--muted);letter-spacing:.04em;margin-bottom:.2rem;}
.quick-card .value{font-size:1.4rem;font-weight:700;color:var(--accent2);}
.quick-card .formula{font-size:.85rem;color:var(--text);}
.quick-card .note{font-size:.72rem;color:var(--muted);line-height:1.6;}
.summary-grid{max-width:1300px;margin:0 auto 1.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center;}
.stat-card .label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem;}
.stat-card .value{font-size:1.1rem;font-weight:700;color:var(--accent);}
.stat-card .value.big{font-size:1.3rem;color:var(--green);}

/* Year sections */
.years{max-width:1300px;margin:0 auto 3rem;}
.year-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;overflow:hidden;}
.year-header{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.2rem;cursor:pointer;user-select:none;transition:.15s;}
.year-header:hover{background:var(--surface2);}
.year-header .year-label{font-weight:700;font-size:1rem;}
.year-header .year-total{font-size:1rem;font-weight:700;color:var(--accent);}
.year-header .year-salary{font-size:.8rem;color:var(--muted);}
.year-header .chevron{color:var(--muted);transition:.2s;font-size:.8rem;}
.year-header.open .chevron{transform:rotate(90deg);}
.year-body{display:none;border-top:1px solid var(--border);}
.year-body.open{display:block;}
.month-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.month-table th{background:var(--surface2);padding:.5rem .75rem;text-align:left;color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;}
.month-table td{padding:.45rem .75rem;border-top:1px solid #1e2035;vertical-align:top;}
.month-table tr:hover td{background:#1e2035;}
.month-name{font-weight:600;white-space:nowrap;}
.month-total{font-weight:700;text-align:right;color:var(--text);}
.items-list{display:flex;flex-wrap:wrap;gap:.3rem;}
.item-chip{background:var(--surface2);border-radius:4px;padding:.15rem .45rem;font-size:.73rem;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.item-chip.salary{border-left:3px solid var(--accent);}
.item-chip.stock{border-left:3px solid var(--accent2);}
.item-chip.quarterly{border-left:3px solid var(--yellow);}
.item-chip.july{border-left:3px solid var(--orange);}
.item-chip.annual{border-left:3px solid var(--green);}
.item-chip.sports{border-left:3px solid var(--red);}
.year-note{margin:0 0 1rem;padding:.55rem .8rem;background:var(--surface2);border-left:3px solid var(--accent2);border-radius:6px;font-size:.78rem;color:var(--muted);line-height:1.6;}
.year-footer{background:var(--surface2);padding:.6rem 1.2rem;display:flex;justify-content:flex-end;gap:2rem;font-size:.82rem;}
.year-footer span{color:var(--muted);}
.year-footer strong{color:var(--text);}

@media(max-width:640px){
  .month-table thead{display:none;}
  .month-table tr{display:block;border-top:1px solid #1e2035;padding:.5rem 0;}
  .month-table td{display:block;border:none;padding:.2rem .75rem;}
  .month-total{text-align:left !important;color:var(--accent);font-size:.85rem;}
  .month-total::before{content:'小計：';color:var(--muted);font-weight:400;}
  .item-chip{white-space:normal;word-break:break-word;}
  .year-header .year-salary{display:none;}
}

/* 10-year table */
.ten-year{max-width:1300px;margin:0 auto 3rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.ten-year h2{padding:1rem 1.2rem;font-size:1rem;border-bottom:1px solid var(--border);}
.ten-year table{width:100%;border-collapse:collapse;font-size:.83rem;}
.ten-year th{background:var(--surface2);padding:.6rem .75rem;text-align:right;color:var(--muted);font-size:.75rem;text-transform:uppercase;}
.ten-year th:first-child{text-align:left;}
.ten-year td{padding:.55rem .75rem;border-top:1px solid #1e2035;text-align:right;}
.ten-year td:first-child{text-align:left;font-weight:600;}
.ten-year tr:hover td{background:#1e2035;}
.ten-year .cumulative{color:var(--green);font-weight:700;}

#results{display:none;}
</style>
</head>
<body>

<h1>📊 台積薪水計算機</h1>
<p class="subtitle">TSMC Salary Calculator — 5 年收入試算</p>

<div class="inputs-panel">
  <div class="field">
    <label>起算月份</label>
    <input type="number" id="startMonth" value="1" min="1" max="12">
    <span class="hint">1 = 1月，12 = 12月</span>
  </div>
  <div class="field">
    <label>月薪（元）</label>
    <input type="number" id="baseSalary" value="65000" step="100" oninput="markPresets()">
    <div class="preset-row">
      <button type="button" class="preset-btn" data-target="baseSalary" data-value="41700" onclick="applyPreset(this)">23</button>
      <button type="button" class="preset-btn" data-target="baseSalary" data-value="65000" onclick="applyPreset(this)">31</button>
      <button type="button" class="preset-btn" data-target="baseSalary" data-value="75500" onclick="applyPreset(this)">32</button>
      <button type="button" class="preset-btn" data-target="baseSalary" data-value="85000" onclick="applyPreset(this)">33</button>
    </div>
  </div>
  <div class="field">
    <label>季分紅月數</label>
    <input type="number" id="quarterlyMonths" value="5.4" step="0.1" oninput="onQuarterlyInput()">
    <div class="preset-row">
      <button type="button" class="preset-btn" data-target="quarterlyMonths" data-value="3.1" onclick="applyPreset(this)">23</button>
      <button type="button" class="preset-btn" data-target="quarterlyMonths" data-value="5.4" onclick="applyPreset(this)">31</button>
      <button type="button" class="preset-btn" data-target="quarterlyMonths" data-value="5.85" onclick="applyPreset(this)">32</button>
      <button type="button" class="preset-btn" data-target="quarterlyMonths" data-value="6.1" onclick="applyPreset(this)">33</button>
    </div>
    <div class="preset-row">
      <button type="button" class="preset-btn rating-btn" data-mult="0.7" onclick="applyRating(this)">S-</button>
      <button type="button" class="preset-btn rating-btn" data-mult="1" onclick="applyRating(this)">S</button>
      <button type="button" class="preset-btn rating-btn" data-mult="1.12" onclick="applyRating(this)">S+</button>
      <button type="button" class="preset-btn rating-btn" data-mult="1.28" onclick="applyRating(this)">O</button>
    </div>
    <span class="hint">每季分紅 = 月薪 × 此數<br>考績：S- ×0.7、S 預設、S+ ×1.12、O ×1.28</span>
  </div>
  <div class="field">
    <label>第一次調薪（%）</label>
    <input type="number" id="firstRaiseRate" value="5" step="0.1">
    <span class="hint">第一個4月套用此比例</span>
  </div>
  <div class="field">
    <label>年調薪（%）</label>
    <input type="number" id="raiseRate" value="5" step="0.1">
    <span class="hint">之後每年4月調薪</span>
  </div>
  <div class="field">
    <label>運動會獎金（元）</label>
    <input type="number" id="sportsBonus" value="30000" step="1000">
    <span class="hint">每年11月發放（第一年金額）</span>
  </div>
  <div class="field">
    <label>運動會獎金年增（元）</label>
    <input type="number" id="sportsBonusGrowth" value="5000" step="1000">
    <span class="hint">每年比前一年多發的金額</span>
  </div>
  <div class="field">
    <label>季分紅成長率（%）</label>
    <input type="number" id="bonusGrowthRate" value="6.779" step="0.1" oninput="syncFromQuarterly(); markPresets()">
    <span class="hint">每季分紅額外成長</span>
  </div>
  <div class="field">
    <label>年分紅成長率（%）</label>
    <input type="number" id="bonusGrowthRateAnnual" value="30" step="0.1" oninput="syncFromAnnual(); markPresets()">
    <div class="preset-row">
      <button type="button" class="preset-btn" data-target="bonusGrowthRateAnnual" data-value="30" onclick="applyPreset(this)">預估</button>
      <button type="button" class="preset-btn" data-target="bonusGrowthRateAnnual" data-value="0" onclick="applyPreset(this)">保守</button>
    </div>
    <span class="hint">換算自季成長率</span>
  </div>
  <div class="field check">
    <label>試用期</label>
    <label class="check-row">
      <input type="checkbox" id="probation" onchange="calculate()">
      <span>考慮試用期</span>
    </label>
    <span class="hint">勾選：前3個月不計分紅、年終按比例、7月後入職無運動會獎金<br>不勾：分紅全額、年終＝月薪×2、第一年也有運動會獎金</span>
  </div>
</div>

<button class="calc-btn" onclick="calculate()">計算薪資</button>

<div id="results">
  <button type="button" class="download-btn" onclick="downloadDetails()">⬇ 下載明細（CSV）</button>
  <div class="quick-card" id="quickCard"></div>
  <div class="summary-grid" id="summaryGrid"></div>
  <div class="ten-year" id="tenYearTable"></div>
  <div class="years" id="yearsContainer"></div>
</div>

<script>
const MONTH_NAMES = ['','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

// Quarter payment definitions: payMonth -> {covered months, yearOffset relative to payment year}
const QUARTERS = {
  2:  { months: [10, 11, 12], yearOffset: -1, label: 'Q4前年(10-12月)' },
  5:  { months: [1, 2, 3],    yearOffset: 0,  label: 'Q1(1-3月)' },
  8:  { months: [4, 5, 6],    yearOffset: 0,  label: 'Q2(4-6月)' },
  11: { months: [7, 8, 9],    yearOffset: 0,  label: 'Q3(7-9月)' }
};

function fmt(n) {
  return '$ ' + Math.round(n).toLocaleString('zh-TW');
}

function calculate() {
  const startMonth      = Math.min(12, Math.max(1, parseInt(document.getElementById('startMonth').value) || 1));
  const baseSalary      = parseFloat(document.getElementById('baseSalary').value) || 65000;
  const quarterlyMonths = parseFloat(document.getElementById('quarterlyMonths').value) || 5;
  const firstRaiseRate  = (parseFloat(document.getElementById('firstRaiseRate').value) || 5) / 100;
  const raiseRate       = (parseFloat(document.getElementById('raiseRate').value) || 5) / 100;
  const sportsBonus     = parseFloat(document.getElementById('sportsBonus').value) || 30000;
  const sportsGrowthRaw = parseFloat(document.getElementById('sportsBonusGrowth').value);
  const sportsBonusGrowth = isNaN(sportsGrowthRaw) ? 5000 : sportsGrowthRaw;
  const bonusGrowthRate = (parseFloat(document.getElementById('bonusGrowthRate').value) || 0) / 100;

  const probation       = document.getElementById('probation').checked;

  // 勾選試用期：前 3 個月不計分紅、年終按在職比例
  // 不勾：每次分紅都全額計算、年終直接 = 月薪 × 2
  const qualifyAbsMonth = probation ? startMonth + 3 : -Infinity;

  // Salary at any abs month: raises happen every April (abs months 4, 16, 28, 40, 52)
  // First raise uses firstRaiseRate, subsequent raises use raiseRate
  function getSalaryAt(absMonth) {
    let raises = 0;
    for (let y = 1; y <= 5; y++) {
      const aprilAbs = (y - 1) * 12 + 4;
      if (aprilAbs >= startMonth && aprilAbs <= absMonth) raises++;
    }
    if (raises === 0) return baseSalary;
    if (raises === 1) return baseSalary * (1 + firstRaiseRate);
    return baseSalary * (1 + firstRaiseRate) * Math.pow(1 + raiseRate, raises - 1);
  }

  // Quarter order within each year: Feb=0, May=1, Aug=2, Nov=3
  const quarterOrder = { 2: 0, 5: 1, 8: 2, 11: 3 };

  // Find the qIdx of the first quarter where the employee actually receives a non-zero bonus
  // so that growth exponent starts at 0 on the first real payout
  let firstEligibleQIdx = Infinity;
  for (let year = 1; year <= 5; year++) {
    for (const [pm, info] of Object.entries(QUARTERS)) {
      const payMonth = parseInt(pm);
      const payAbsMonth = (year - 1) * 12 + payMonth;
      const covYear = year + info.yearOffset;
      if (payAbsMonth < startMonth) continue;
      let eligible = 0;
      for (const m of info.months) {
        if ((covYear - 1) * 12 + m >= qualifyAbsMonth) eligible++;
      }
      if (eligible > 0) {
        firstEligibleQIdx = Math.min(firstEligibleQIdx, (year - 1) * 4 + quarterOrder[payMonth]);
      }
    }
  }
  if (firstEligibleQIdx === Infinity) firstEligibleQIdx = 0;

  const qPaid = {}; // key: `${year}-${month}`
  for (let year = 1; year <= 5; year++) {
    for (const [pm, info] of Object.entries(QUARTERS)) {
      const payMonth = parseInt(pm);
      const payAbsMonth = (year - 1) * 12 + payMonth;
      const covYear = year + info.yearOffset;

      if (payAbsMonth < startMonth) { qPaid[`${year}-${payMonth}`] = { amount: 0, effMonths: 0 }; continue; }

      let eligible = 0;
      for (const m of info.months) {
        const covAbs = (covYear - 1) * 12 + m;
        if (covAbs >= qualifyAbsMonth) eligible++;
      }
      const qIdx = (year - 1) * 4 + quarterOrder[payMonth];
      const bonusGrowth = Math.pow(1 + bonusGrowthRate, qIdx - firstEligibleQIdx);
      // Q1 (paid May) covers Jan-Mar which are before the April raise → use pre-raise salary (March)
      const bonusSalary = (payMonth === 5)
        ? getSalaryAt((year - 1) * 12 + 3)
        : getSalaryAt(payAbsMonth);
      const effMonths = quarterlyMonths * (eligible / 3) * bonusGrowth;
      qPaid[`${year}-${payMonth}`] = { amount: bonusSalary * effMonths, effMonths };
    }
  }

  // Build monthly breakdown for 5 years
  const results = [];
  let cumulativeTotal = 0;

  for (let year = 1; year <= 5; year++) {
    let yearTotal = 0;
    const months = [];

    for (let month = 1; month <= 12; month++) {
      const absMonth = (year - 1) * 12 + month;
      if (absMonth < startMonth) continue;

      const salary = getSalaryAt(absMonth);
      let income = 0;
      const items = [];

      // 1. Monthly salary
      income += salary;
      items.push({ label: '月薪', amount: salary, cls: 'salary' });

      // 2. Stock subsidy 3%
      const stock = salary * 0.03;
      income += stock;
      items.push({ label: '購股補貼 3%', amount: stock, cls: 'stock' });

      // 3. Quarterly bonus (Feb, May, Aug, Nov)
      if (QUARTERS[month]) {
        const q = qPaid[`${year}-${month}`] || { amount: 0, effMonths: 0 };
        if (q.amount > 0) {
          income += q.amount;
          const info = QUARTERS[month];
          const covYear = year + info.yearOffset;
          let eligible = 0;
          for (const m of info.months) {
            if ((covYear - 1) * 12 + m >= qualifyAbsMonth) eligible++;
          }
          const label = eligible < 3
            ? `季分紅 ${QUARTERS[month].label} (${eligible}/3)`
            : `季分紅 ${QUARTERS[month].label}`;
          items.push({ label, amount: q.amount, effMonths: q.effMonths, cls: 'quarterly' });
        }
      }

      // 4. July bonus: current year Feb + previous year May+Aug+Nov
      if (month === 7 && year >= 2) {
        const curFeb  = (qPaid[`${year}-2`]    || { amount: 0 }).amount;
        const prevMay = (qPaid[`${year-1}-5`]  || { amount: 0 }).amount;
        const prevAug = (qPaid[`${year-1}-8`]  || { amount: 0 }).amount;
        const prevNov = (qPaid[`${year-1}-11`] || { amount: 0 }).amount;
        const julyBonus = curFeb + prevMay + prevAug + prevNov;
        if (julyBonus > 0) {
          income += julyBonus;
          items.push({ label: '7月年度分紅(當年2月+前年5+8+11月)', amount: julyBonus, cls: 'july' });
        }
      }

      // 5. Year-end bonus (January, covers previous year) — use December salary of prev year
      if (month === 1 && year >= 2) {
        const prevDecSalary = getSalaryAt((year - 2) * 12 + 12);
        const prevYearStart = (year - 2) * 12 + 1;
        const prevYearEnd   = (year - 1) * 12;
        const firstEligible = Math.max(startMonth, prevYearStart);
        const eligibleMths  = Math.max(0, prevYearEnd - firstEligible + 1);
        if (eligibleMths > 0) {
          const ratio = probation ? eligibleMths / 12 : 1;
          const annualBonus = prevDecSalary * 2 * ratio;
          income += annualBonus;
          const label = probation
            ? `年終獎金(${eligibleMths}/12 個月)`
            : '年終獎金(月薪 × 2)';
          items.push({ label, amount: annualBonus, cls: 'annual' });
        }
      }

      // 6. Sports bonus (November) — year 1 only if joined before July
      const eligibleSports = !probation || year > 1 || startMonth <= 6;
      if (month === 11 && eligibleSports) {
        const sportsAmount = sportsBonus + sportsBonusGrowth * (year - 1);
        income += sportsAmount;
        items.push({ label: '運動會獎金', amount: sportsAmount, cls: 'sports' });
      }

      yearTotal += income;
      months.push({ month, income, items });
    }

    // Use December salary of this year as representative for headers/table
    const yearEndSalary = getSalaryAt((year - 1) * 12 + 12);
    cumulativeTotal += yearTotal;
    results.push({ year, salary: yearEndSalary, yearTotal, cumulativeTotal, months });
  }

  lastResults = results;
  renderResults(results, baseSalary, startMonth, quarterlyMonths);
  document.getElementById('results').style.display = 'block';
}

function renderResults(results, baseSalary, startMonth, quarterlyMonths) {
  // Quick estimate card: (分紅月數 × 8 + 14) × 底薪
  const quickMonths = quarterlyMonths * 8 + 14;
  document.getElementById('quickCard').innerHTML = `
    <div>
      <div class="label">⚡ 快速估算年薪</div>
      <div class="value">${fmt(quickMonths * baseSalary)}</div>
    </div>
    <div class="formula">(${quarterlyMonths} × 8 + 14) ＝ ${parseFloat(quickMonths.toFixed(2))} 個月 × 月薪 ${fmt(baseSalary)}</div>
    <div class="note">
      說明：此為網路常見算法。分紅月數 × 8 ＝ 4 次季分紅 ＋ 7 月年度分紅（約等於 4 季分紅總和）；14 ＝ 12 個月月薪 ＋ 年終 2 個月。<br>
      以目前月薪計算一整年，不含購股補貼、運動會獎金、調薪與分紅成長，也不考慮試用期，僅供快速參考。
    </div>
  `;

  const yr5 = results[4];
  const yr1  = results[0];

  // Summary cards
  document.getElementById('summaryGrid').innerHTML = `
    <div class="stat-card">
      <div class="label">起薪</div>
      <div class="value">${fmt(baseSalary)}</div>
    </div>
    <div class="stat-card">
      <div class="label">第1年收入</div>
      <div class="value">${fmt(yr1.yearTotal)}</div>
    </div>
    <div class="stat-card">
      <div class="label">第5年月薪</div>
      <div class="value">${fmt(yr5.salary)}</div>
    </div>
    <div class="stat-card">
      <div class="label">第5年收入</div>
      <div class="value">${fmt(yr5.yearTotal)}</div>
    </div>
    <div class="stat-card">
      <div class="label">5年總收入</div>
      <div class="value big">${fmt(yr5.cumulativeTotal)}</div>
    </div>
  `;

  // 10-year summary table
  let tableRows = results.map(r => `
    <tr>
      <td>第 ${r.year} 年</td>
      <td>${fmt(r.salary)}</td>
      <td>${fmt(r.yearTotal)}</td>
      <td class="cumulative">${fmt(r.cumulativeTotal)}</td>
    </tr>
  `).join('');

  document.getElementById('tenYearTable').innerHTML = `
    <h2>📈 五年收入總覽</h2>
    <table>
      <thead><tr>
        <th>年份</th><th>月薪</th><th>年度收入</th><th>累計總收入</th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  `;

  // Year-by-year detail
  let yearsHTML = results.map(r => {
    const monthRows = r.months.map(m => {
      const chips = m.items.map(it => {
        const suffix = it.effMonths != null ? ` ( ${it.effMonths.toFixed(2)} 個月 )` : '';
        return `<span class="item-chip ${it.cls}">${it.label}：${fmt(it.amount)}${suffix}</span>`;
      }).join('');
      return `
        <tr>
          <td class="month-name">${MONTH_NAMES[m.month]}</td>
          <td><div class="items-list">${chips}</div></td>
          <td class="month-total">${fmt(m.income)}</td>
        </tr>
      `;
    }).join('');

    return `
      ${r.year === 3 ? `<div class="year-note">※ 第二年 7 月年度分紅 ＝ 當年 2 月 ＋ 前一年 5、8、11 月季分紅。若起算月份晚於第一年的 5、8、11 月，這幾筆季分紅不會計入，7 月年度分紅&第二年年薪會偏低，非新人前一年有領到請自行加入計算。</div>` : ''}
      <div class="year-block">
        <div class="year-header" onclick="toggleYear(this)">
          <span class="year-label">第 ${r.year} 年</span>
          <span class="year-salary">月薪 ${fmt(r.salary)}</span>
          <span class="year-total">${fmt(r.yearTotal)}</span>
          <span class="chevron">▶</span>
        </div>
        <div class="year-body">
          <table class="month-table">
            <thead><tr>
              <th style="width:70px">月份</th>
              <th>收入明細</th>
              <th style="width:120px;text-align:right">小計</th>
            </tr></thead>
            <tbody>${monthRows}</tbody>
          </table>
          <div class="year-footer">
            <span>年度合計：<strong style="color:var(--accent)">${fmt(r.yearTotal)}</strong></span>
            <span>累計：<strong style="color:var(--green)">${fmt(r.cumulativeTotal)}</strong></span>
          </div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('yearsContainer').innerHTML = yearsHTML;
}

let lastResults = null;

// Download month-by-month details as CSV (with BOM so Excel reads Chinese correctly)
function downloadDetails() {
  if (!lastResults) calculate();
  const cols = [
    ['salary', '月薪'], ['stock', '購股補貼 3%'], ['quarterly', '季分紅'],
    ['july', '7月年度分紅'], ['annual', '年終'], ['sports', '運動會獎金']
  ];
  const esc = v => {
    const t = String(v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const rows = [['年度', '月份', ...cols.map(c => c[1]), '月小計', '累計', '備註']];
  let running = 0;
  for (const r of lastResults) {
    for (const m of r.months) {
      running += m.income;
      const sums = Object.fromEntries(cols.map(c => [c[0], 0]));
      const notes = [];
      for (const it of m.items) {
        if (it.cls in sums) sums[it.cls] += it.amount;
        if (it.cls === 'quarterly' || it.cls === 'july' || it.cls === 'annual') {
          notes.push(it.effMonths != null ? `${it.label} (${it.effMonths.toFixed(2)} 個月)` : it.label);
        }
      }
      rows.push([
        `第${r.year}年`, MONTH_NAMES[m.month],
        ...cols.map(c => Math.round(sums[c[0]])),
        Math.round(m.income), Math.round(running), notes.join('; ')
      ]);
    }
    rows.push([`第${r.year}年合計`, '', ...cols.map(() => ''), Math.round(r.yearTotal), Math.round(r.cumulativeTotal), '']);
  }
  const csv = '\uFEFF' + rows.map(row => row.map(esc).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'TSMC薪資明細.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function toggleYear(header) {
  header.classList.toggle('open');
  const body = header.parentElement.querySelector('.year-body');
  body.classList.toggle('open');
}

function syncFromQuarterly() {
  const q = parseFloat(document.getElementById('bonusGrowthRate').value) || 0;
  const annual = (Math.pow(1 + q / 100, 4) - 1) * 100;
  document.getElementById('bonusGrowthRateAnnual').value = parseFloat(annual.toFixed(4));
}

function syncFromAnnual() {
  const a = parseFloat(document.getElementById('bonusGrowthRateAnnual').value) || 0;
  const quarterly = (Math.pow(1 + a / 100, 1 / 4) - 1) * 100;
  document.getElementById('bonusGrowthRate').value = parseFloat(quarterly.toFixed(4));
}

// Preset buttons: fill the field, keep linked fields in sync, recalculate
// 季分紅月數 = 職等基準月數 × 考績倍率
let quarterlyBase = 5.4;
let ratingMult = 1;

function setQuarterlyFromBase() {
  document.getElementById('quarterlyMonths').value = parseFloat((quarterlyBase * ratingMult).toFixed(3));
}

// Rating buttons: apply multiplier to the grade's base months
function applyRating(btn) {
  ratingMult = parseFloat(btn.dataset.mult);
  setQuarterlyFromBase();
  markPresets();
  calculate();
}

// Typing a value directly: treat it as the new base and reset rating to S
function onQuarterlyInput() {
  quarterlyBase = parseFloat(document.getElementById('quarterlyMonths').value) || 0;
  ratingMult = 1;
  markPresets();
}

function applyPreset(btn) {
  if (btn.dataset.target === 'quarterlyMonths') {
    quarterlyBase = parseFloat(btn.dataset.value);
    setQuarterlyFromBase();
    markPresets();
    calculate();
    return;
  }
  document.getElementById(btn.dataset.target).value = btn.dataset.value;
  if (btn.dataset.target === 'bonusGrowthRateAnnual') syncFromAnnual();
  markPresets();
  calculate();
}

// Highlight the preset whose value matches what is in its field
function markPresets() {
  document.querySelectorAll('.rating-btn').forEach(btn => {
    btn.classList.toggle('active', Math.abs(ratingMult - parseFloat(btn.dataset.mult)) < 1e-6);
  });
  document.querySelectorAll('.preset-btn[data-target]').forEach(btn => {
    const v = btn.dataset.target === 'quarterlyMonths'
      ? quarterlyBase
      : parseFloat(document.getElementById(btn.dataset.target).value);
    btn.classList.toggle('active', Math.abs(v - parseFloat(btn.dataset.value)) < 1e-3);
  });
}

// Auto-calculate on load
window.addEventListener('load', () => {
  document.getElementById('startMonth').value = new Date().getMonth() + 1;
  markPresets();
  calculate();
});
</script>
